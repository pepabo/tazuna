apiVersion: tazuna.pepabo.com/v1
kind: GenesisSecret
spec:
  secrets:
    - items:
        accessKeyID:
          mapTo: AWS_ACCESS_KEY_ID
  outputs:
    - kubernetesSecret:
        name: sample-secret
        namespace: default 
        labels:
          foo: bar
        annotations:
          foo: bar
        type: kubernetes.io/tls
