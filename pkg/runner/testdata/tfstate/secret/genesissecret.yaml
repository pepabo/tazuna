apiVersion: tazuna.pepabo.com/v1
kind: GenesisSecret
spec:
  provider: tf-infra
  secrets:
    - items:
        output.db_password:
          mapTo: PASSWORD
        aws_db_instance.main.address:
          mapTo: HOST
        aws_db_instance.main.port:
          mapTo: PORT
  outputs:
    - kubernetesSecret:
        namespace: platform
        name: db
