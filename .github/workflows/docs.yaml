name: Documentation

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MDBOOK_VERSION: "0.5.2"
  MDBOOK_I18N_HELPERS_VERSION: "0.3.6"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d52ca7910e8b6f4b1ddd2b134915b9bcdcfb # v2.0.0
        with:
          mdbook-version: ${{ env.MDBOOK_VERSION }}
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: mdbook-i18n-helpers-${{ env.MDBOOK_I18N_HELPERS_VERSION }}
      - name: Install mdbook-i18n-helpers
        run: cargo install mdbook-i18n-helpers --locked --version ${{ env.MDBOOK_I18N_HELPERS_VERSION }}
      - name: Build (English)
        working-directory: docs
        run: mdbook build -d book/en
      - name: Build (Japanese)
        working-directory: docs
        env:
          MDBOOK_BOOK__LANGUAGE: ja
        run: mdbook build -d book/ja
      - name: Compose language landing
        run: cp docs/static/index.html docs/book/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658c3e0aa114b29229ed2bb8db # v4.0.0
        with:
          path: docs/book

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
