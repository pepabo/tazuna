name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".tagpr"
      - "CHANGELOG.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".tagpr"
      - "CHANGELOG.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOMODCACHE: ${{ github.workspace }}/.go/pkg/mod
  GOCACHE: ${{ github.workspace }}/.go/cache
  GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.golangci-lint-cache

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Cache Go modules
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ github.workspace }}/.go/pkg/mod
        key: ${{ runner.os }}-${{ runner.arch }}-go-mod-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-mod-
    - name: Cache Go build
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ github.workspace }}/.go/cache
        key: ${{ runner.os }}-${{ runner.arch }}-go-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-build-${{ hashFiles('go.sum') }}-
          ${{ runner.os }}-${{ runner.arch }}-go-build-
    - name: test
      run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
    - name: coverage summary
      if: always()
      run: |
        if [ -f coverage.out ]; then
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          {
            echo "### Unit test coverage"
            echo ""
            echo "Total: \`${total}\`"
            echo ""
            echo "<details><summary>Per-package</summary>"
            echo ""
            echo '```'
            go tool cover -func=coverage.out | awk '$1 ~ /\.go:/ {next} {print}'
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: upload coverage artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-unit
        path: coverage.out
        if-no-files-found: ignore
    - name: build
      run: go build .

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Cache Go modules
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ github.workspace }}/.go/pkg/mod
        key: ${{ runner.os }}-${{ runner.arch }}-go-mod-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-mod-
    - name: Cache Go build
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ github.workspace }}/.go/cache
        key: ${{ runner.os }}-${{ runner.arch }}-go-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-build-${{ hashFiles('go.sum') }}-
          ${{ runner.os }}-${{ runner.arch }}-go-build-
    - name: Cache golangci-lint
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ github.workspace }}/.golangci-lint-cache
        key: ${{ runner.os }}-${{ runner.arch }}-golangci-lint-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-golangci-lint-${{ hashFiles('go.sum') }}-
          ${{ runner.os }}-${{ runner.arch }}-golangci-lint-
    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
      with:
        install-only: true
    - name: lint
      run: golangci-lint run

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest 
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Cache Go modules
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ github.workspace }}/.go/pkg/mod
        key: ${{ runner.os }}-${{ runner.arch }}-go-mod-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-mod-
    - name: Cache Go build
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ github.workspace }}/.go/cache
        key: ${{ runner.os }}-${{ runner.arch }}-go-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-build-${{ hashFiles('go.sum') }}-
          ${{ runner.os }}-${{ runner.arch }}-go-build-
    - name: Integration Tests
      run: go test -tags=integration ./...

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND_VERSION: v0.31.0
      KIND_NODE_IMAGE: kindest/node:v1.32.0
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Cache Go modules
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ github.workspace }}/.go/pkg/mod
        key: ${{ runner.os }}-${{ runner.arch }}-go-mod-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-mod-
    - name: Cache Go build
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ github.workspace }}/.go/cache
        key: ${{ runner.os }}-${{ runner.arch }}-go-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-build-${{ hashFiles('go.sum') }}-
          ${{ runner.os }}-${{ runner.arch }}-go-build-
    - name: Set up home directory and PATH
      run: |
        if [ -z "$HOME" ] || [ ! -d "$HOME" ]; then
          ACTUAL_HOME=$(getent passwd "$(id -un)" | cut -d: -f6)
          echo "Fixing HOME: '${HOME}' -> '${ACTUAL_HOME}'"
          echo "HOME=${ACTUAL_HOME}" >> $GITHUB_ENV
          export HOME="$ACTUAL_HOME"
        fi
        echo "whoami: $(whoami), HOME: $HOME"
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV
    - name: Restore binary cache
      id: cache-binaries
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.local/bin/kubectl
          ~/.local/bin/kind
        key: binaries-${{ runner.os }}-kubectl-kind-${{ env.KIND_VERSION }}
        restore-keys: |
          binaries-${{ runner.os }}-kubectl-kind-
    - name: Create binary directory
      run: |
        mkdir -p "$HOME/.local/bin"
    - name: Install kubectl
      if: steps.cache-binaries.outputs.cache-hit != 'true'
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        mv kubectl ~/.local/bin/
    - name: Install KinD
      if: steps.cache-binaries.outputs.cache-hit != 'true'
      run: |
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64
        chmod +x ./kind
        mv ./kind ~/.local/bin/kind
    - name: Verify binary versions
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        echo "PATH: $PATH"
        echo "HOME: $HOME"
        kubectl version --client
        kind version
    - name: Setup kind cluster and build binary
      run: |
        # Build the tazuna binary in parallel with kind cluster setup.
        # kind create cluster waits for k8s control plane (~16s) and
        # go build takes ~17s — running both at once saves ~17s.
        go build . &
        BUILD_PID=$!
        kind create cluster --name tazuna --image "${KIND_NODE_IMAGE}" --config .github/kind-config.yaml
        kubectl cluster-info --context kind-tazuna
        wait "${BUILD_PID}"
    - name: E2E Tests
      run: go test -tags=e2e -count=1 ./test/e2e/...
      env:
        KUBERNETES_SERVICE_HOST: ""
        KUBERNETES_SERVICE_PORT: ""
