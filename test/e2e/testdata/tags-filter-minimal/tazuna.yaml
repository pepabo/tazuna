apiVersion: tazuna.pepabo.com/v1
kind: Tazuna
spec:
  manifests:
    - name: "tags-filter-alpha"
      description: "e2e: only alpha should be applied with the --tags filter"
      type: kustomize
      path: ./kustomize-alpha
      tags:
        - alpha
    - name: "tags-filter-beta"
      description: "e2e: beta should not be applied with the --tags filter"
      type: kustomize
      path: ./kustomize-beta
      tags:
        - beta
