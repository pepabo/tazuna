apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-beta
  namespace: tazuna-e2e-tags-filter
  labels:
    app: nginx-beta
    tazuna.pepabo.com/e2e: tags-filter-minimal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-beta
  template:
    metadata:
      labels:
        app: nginx-beta
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
