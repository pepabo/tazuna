apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-chart-nginx
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: simple-chart-nginx
  template:
    metadata:
      labels:
        app: simple-chart-nginx
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
