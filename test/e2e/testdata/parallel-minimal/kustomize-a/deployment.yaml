apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-a
  namespace: tazuna-e2e-parallel
  labels:
    app: nginx-a
    tazuna.pepabo.com/e2e: parallel-minimal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-a
  template:
    metadata:
      labels:
        app: nginx-a
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
