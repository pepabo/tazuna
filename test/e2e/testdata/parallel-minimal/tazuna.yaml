apiVersion: tazuna.pepabo.com/v1
kind: Tazuna
spec:
  manifests:
    - name: "parallel-minimal-nginx-ab"
      description: "ADR005 Phase 2 e2e: minimal apply scenario for the parallel manager (two kustomize children)"
      type: parallel
      path: "."
      tags:
        - parallel-minimal
      parallel:
        children:
          - name: "parallel-minimal-nginx-a"
            type: kustomize
            path: ./kustomize-a
          - name: "parallel-minimal-nginx-b"
            type: kustomize
            path: ./kustomize-b
