<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tazuna Documentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=M+PLUS+U:wght@400;500;700&display=swap">
    <style>
      :root {
        --font-sans-tazuna: "M PLUS U", system-ui, -apple-system, "Segoe UI",
          "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      }
      body {
        font-family: var(--font-sans-tazuna);
        max-width: 32rem;
        margin: 4rem auto;
        padding: 0 1.5rem;
        color: #222;
        line-height: 1.6;
      }
      h1 { font-size: 1.75rem; margin-bottom: 0.25rem; font-weight: 700; }
      p.lead { color: #555; margin-top: 0; }
      ul.langs { list-style: none; padding: 0; margin-top: 2rem; }
      ul.langs li { margin: 0.75rem 0; }
      ul.langs a {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        text-decoration: none;
        color: #0066cc;
        font-weight: 500;
      }
      ul.langs a:hover { background: #f5f5f5; }
      footer { margin-top: 3rem; font-size: 0.85rem; color: #888; }
      footer a { color: #0066cc; }
      footer p { margin: 0.25rem 0; }
    </style>
  </head>
  <body>
    <h1>Tazuna Documentation</h1>
    <p class="lead">Choose your language / 言語を選択してください</p>
    <ul class="langs">
      <li><a href="en/" hreflang="en">English</a></li>
      <li><a href="ja/" hreflang="ja">日本語</a></li>
    </ul>
    <footer>
      <p><a href="https://github.com/pepabo/tazuna">github.com/pepabo/tazuna</a></p>
      <p>
        Font:
        <a href="https://fonts.google.com/specimen/M+PLUS+U">M PLUS U</a>
        (<a href="https://openfontlicense.org/">OFL-1.1</a>)
      </p>
    </footer>
  </body>
</html>
